<section class="checkout-page">
  <h1>Kassan</h1>

  <table class="checkout-table">
  <thead>
    <tr>
      <th></th>
      <th>Produkt</th>
      <th>Pris</th>
      <th>Totalt</th>
      <th>Antal</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (item of basketService.itemsReadonly(); track item.productId) {
      <tr>
        <td class="checkout-image-cell">
          <app-themed-image
            [baseUrl]="item.imageUrl"
            [fallbackUrl]="item.shapeSlug ? 'https://fnnyyflzqqvqwanjmnht.supabase.co/storage/v1/object/public/images/shapes/' + item.shapeSlug : 'https://fnnyyflzqqvqwanjmnht.supabase.co/storage/v1/object/public/images/shapes/serie'"
            [alt]="item.name"
          />
        </td>
        <td>{{ item.name }}</td>
        <td>{{ item.price }} kr</td>
        <td>{{ item.price * item.quantity }} kr</td>
        <td>
          <div class="quantity-stepper">
            <button type="button" (click)="decrease(item.productId, item.quantity)" aria-label="Minska antal">−</button>
            <span>{{ item.quantity }}</span>
            <button type="button" (click)="increase(item.productId, item.quantity)" aria-label="Öka antal">+</button>
          </div>
        </td>
        <td>
          <button type="button" class="remove-button" (click)="remove(item.productId)" aria-label="Ta bort">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.166m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>

<div class="checkout-total">
  <p>Totalt: {{ basketService.totalPrice() }} kr</p>
</div>

  <h2>Kunduppgifter</h2>

  <form class="checkout-form">
    <div class="name-row">
      <label>
        Förnamn
        <input type="text" name="firstName" />
      </label>
      <label>
        Efternamn
        <input type="text" name="lastName" />
      </label>
    </div>

    <label>
      E-post
      <input type="email" name="email" />
    </label>

    <fieldset class="address-fieldset">
      <legend>Adress</legend>
      <label>
        Gata
        <input type="text" name="street" />
      </label>
      <label>
        Postnummer
        <input type="text" name="postalCode" />
      </label>
      <label>
        Stad
        <input type="text" name="city" />
      </label>
    </fieldset>

    <label class="newsletter-checkbox">
      <input type="checkbox" name="newsletter" />
      Jag vill ta emot nyhetsbrev
    </label>

    <button type="button" class="checkout-buy-button">Köp</button>
  </form>
</section>
